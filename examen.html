<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Examen — Epistemología y Pedagogía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/examen.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">EP</span>
      <span class="brand-text">Epistemología y Pedagogía</span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="compendio.html">Compendio</a>
      <a href="diapositivas/">Diapositivas</a>
      <a href="actividades.html">Actividades</a>
      <a href="biblioteca.html">Biblioteca</a>
      <a href="examen.html" aria-current="page">Examen</a>
      <a href="mi-progreso.html">Mi progreso</a>
      <a href="admin.html" class="nav-admin">Panel docente</a>
    </nav>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="wrap examen-wrap">

  <section id="examen-login">
    <div class="examen-card">
      <h1>Examen en línea</h1>
      <p>Entra con los mismos datos que usa tu docente para registrarte.</p>
      <form id="form-login">
        <label for="login-grupo" class="field-label">Grupo</label>
        <select id="login-grupo"><option value="">— Elige tu grupo —</option></select>

        <label for="login-nombre" class="field-label">Tu nombre completo</label>
        <input id="login-nombre" type="text" placeholder="Como te registró tu docente" required>

        <label for="login-pin" class="field-label">PIN</label>
        <input id="login-pin" type="text" inputmode="numeric" placeholder="4 dígitos" required>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p id="login-error" class="login-error" hidden></p>
      </form>
    </div>
  </section>

  <section id="examen-sala" hidden>
    <div class="examen-top-bar">
      <span id="whoami"></span>
      <button id="btn-salir" class="btn-ghost-dark btn-small">Salir</button>
    </div>
    <div id="sala-estado"></div>
  </section>

  <section id="examen-curso" hidden>
    <div class="examen-barra-fija">
      <div class="examen-barra-info">
        <span id="barra-alumno"></span>
        <span id="barra-avance"></span>
      </div>
      <div class="examen-barra-derecha">
        <span id="estado-conexion" class="estado-conexion con-ok">En línea</span>
        <span id="cronometro">--:--</span>
      </div>
    </div>
    <div id="reactivos-root"></div>
    <button id="btn-entregar" class="btn btn-primary btn-block">Entregar examen</button>
    <p class="field-hint" style="text-align:center; margin-top:10px;">Revisa que hayas contestado todo antes de entregar. No podrás volver atrás.</p>
  </section>

  <section id="examen-bloqueado" hidden></section>

  <section id="examen-resultado" hidden></section>

</main>

<script src="js/app.js"></script>
<script type="module" src="js/examen.js"></script>
</body>
</html>
