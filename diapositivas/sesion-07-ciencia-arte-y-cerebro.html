      pasos: [
        { num: "Pilar 1", titulo: "Atención", color: "#2E5E8C", texto: "El cerebro **selecciona** la información: lo que no recibe atención difícilmente se aprende.", ejemplo: "Una clase con demasiados estímulos a la vez, o con distracciones constantes, dificulta aprender." },
        { num: "Pilar 2", titulo: "Compromiso activo", color: "#C98A2C", texto: "Un organismo pasivo aprende poco: el alumno debe **generar hipótesis, intentar, responder, predecir**.", ejemplo: "No es que se mueva todo el tiempo: es que **su mente esté activa**." },
        { num: "Pilar 3", titulo: "Retroalimentación del error", color: "#A83232", texto: "El cerebro aprende cuando nota la diferencia entre **lo que esperaba y lo que ocurrió**. El error es información, no fracaso." },
        { num: "Pilar 4", titulo: "Consolidación", color: "#3F7A4F", texto: "Lo aprendido debe **volverse automático** para liberar la mente.", ejemplo: "Requiere práctica, **repetición espaciada y sueño**." },
        { num: "La pregunta", titulo: "¿Qué pilar falla?", color: "#A83232",
          pregunta: "Un examen se devuelve **tres semanas después**, solo con la calificación y sin comentarios. ¿Qué pilar se descuida?",
          respuesta: "La **retroalimentación del error**: para aprender del error hace falta saber **cuál fue**, y pronto. Una retroalimentación rápida y precisa, sin castigo, es de las herramientas más poderosas.",
          encenderAlResponder: true }
      ] },
