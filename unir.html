<meta name="robots" content="noindex">
<!-- El QR de cada equipo trae una dirección corta (unir.html#CODIGO) para que el
     código salga menos denso y cualquier celular lo lea; aquí se pasa a Tareas. -->
<script>
  (function () {
    var c = (location.hash || '').replace('#', '').replace(/[^A-Za-z0-9]/g, '').slice(0, 4).toUpperCase();
    location.replace('tareas.html' + (c.length === 4 ? '#unir-' + c : ''));
  })();
</script>
